<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CALCULATOR</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #2b2b2b;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      color: #ffffff;
    }

    /* --- Navigation Header --- */
    header {
      width: 100%;
      background-color: rgba(0, 0, 0, 0.3);
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(8px);
    }

    .logo {
      color: #ffffff;
      font-size: 20px;
      font-weight: 700;
      text-decoration: none;
    }

    nav {
      display: flex;
      gap: 8px;
    }

    nav a {
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    nav a:hover, nav a.active {
      background-color: rgba(255, 255, 255, 0.2);
    }

    .tool-view {
      display: none;
      width: 100%;
      max-width: 950px;
      padding: 20px;
      flex-direction: column;
      align-items: center;
    }

    .tool-view.active {
      display: flex;
    }

    /* --- Basic Calculator --- */
    .calc-container {
      margin-top: 30px;
      background-color: #1e1e1e;
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      width: 320px;
    }

    .calc-display {
      width: 100%;
      height: 60px;
      background-color: #111111;
      border: none;
      border-radius: 10px;
      color: #00ffcc;
      font-size: 28px;
      text-align: right;
      padding: 10px 15px;
      margin-bottom: 20px;
      outline: none;
    }

    .calc-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button.calc-btn {
      height: 55px;
      border-radius: 12px;
      border: none;
      background-color: #333333;
      color: #ffffff;
      font-size: 20px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button.calc-btn:hover { background-color: #444444; }
    button.calc-btn.operator { background-color: #f97316; }
    button.calc-btn.operator:hover { background-color: #ea580c; }
    button.calc-btn.clear { background-color: #ef4444; }
    button.calc-btn.clear:hover { background-color: #dc2626; }

    /* --- Desmos-style Grapher Layout --- */
    .graph-wrapper {
      display: flex;
      gap: 20px;
      width: 100%;
      background-color: #1e1e1e;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .function-sidebar {
      width: 300px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .function-sidebar h3 {
      font-size: 18px;
      color: #00ffcc;
      margin-bottom: 5px;
    }

    .fn-input-group {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #111;
      padding: 8px 12px;
      border-radius: 8px;
    }

    .fn-indicator {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }

    .fn-input-group input {
      width: 100%;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 15px;
      outline: none;
    }

    .plot-btn {
      padding: 12px;
      background-color: #3b82f6;
      border: none;
      border-radius: 8px;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    canvas {
      background-color: #111111;
      border-radius: 12px;
      flex: 1;
      height: 420px;
    }

    /* --- Expanded Unit Converter --- */
    .converter-card {
      background-color: #1e1e1e;
      padding: 24px;
      border-radius: 16px;
      width: 100%;
      max-width: 450px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .converter-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .converter-card input, .converter-card select {
      padding: 12px;
      border-radius: 8px;
      border: none;
      background-color: #111;
      color: #fff;
      font-size: 15px;
      outline: none;
    }
  </style>
</head>
<body>

  <header>
    <a href="#" class="logo" onclick="switchTool('basic')">📐 CALCULATOR</a>
    <nav>
      <a onclick="switchTool('basic')" id="nav-basic" class="active">Basic</a>
      <a onclick="switchTool('graph')" id="nav-graph">Graph</a>
      <a onclick="switchTool('converter')" id="nav-converter">Unit Converter</a>
    </nav>
  </header>

  <div class="tool-view active" id="tool-basic">
    <div class="calc-container">
      <input type="text" class="calc-display" id="display" readonly placeholder="0">
      <div class="calc-grid">
        <button class="calc-btn clear" onclick="clearDisplay()">C</button>
        <button class="calc-btn" onclick="appendValue('/')">/</button>
        <button class="calc-btn" onclick="appendValue('*')">*</button>
        <button class="calc-btn" onclick="appendValue('-')">-</button>

        <button class="calc-btn" onclick="appendValue('7')">7</button>
        <button class="calc-btn" onclick="appendValue('8')">8</button>
        <button class="calc-btn" onclick="appendValue('9')">9</button>
        <button class="calc-btn" onclick="appendValue('+')">+</button>

        <button class="calc-btn" onclick="appendValue('4')">4</button>
        <button class="calc-btn" onclick="appendValue('5')">5</button>
        <button class="calc-btn" onclick="appendValue('6')">6</button>
        <button class="calc-btn operator" onclick="calculate()">=</button>

        <button class="calc-btn" onclick="appendValue('1')">1</button>
        <button class="calc-btn" onclick="appendValue('2')">2</button>
        <button class="calc-btn" onclick="appendValue('3')">3</button>
        <button class="calc-btn" onclick="appendValue('0')">0</button>
      </div>
    </div>
  </div>

  <div class="tool-view" id="tool-graph">
    <div class="graph-wrapper">
      <div class="function-sidebar">
        <h3>Functions</h3>
        
        <div class="fn-input-group">
          <div class="fn-indicator" style="background-color: #ef4444;"></div>
          <input type="text" id="fn1" value="x * x" placeholder="f(x) e.g. x * x">
        </div>

        <div class="fn-input-group">
          <div class="fn-indicator" style="background-color: #3b82f6;"></div>
          <input type="text" id="fn2" value="Math.sin(x)" placeholder="g(x) e.g. Math.sin(x)">
        </div>

        <div class="fn-input-group">
          <div class="fn-indicator" style="background-color: #22c55e;"></div>
          <input type="text" id="fn3" value="" placeholder="h(x) e.g. 2 * x + 1">
        </div>

        <button class="plot-btn" onclick="drawGraph()">Plot Functions</button>
      </div>

      <canvas id="graphCanvas" width="550" height="420"></canvas>
    </div>
  </div>

  <div class="tool-view" id="tool-converter">
    <div class="converter-card">
      <h2>Unit Converter</h2>
      
      <div class="converter-row">
        <label>Conversion Category:</label>
        <select id="convType" onchange="convertUnits()">
          <option value="length">Length (Meters to Feet)</option>
          <option value="weight">Weight (Kilograms to Pounds)</option>
          <option value="temp">Temperature (Celsius to Fahrenheit)</option>
        </select>
      </div>

      <div class="converter-row">
        <label id="inputLabel">Input Value:</label>
        <input type="number" id="unitInput" placeholder="Enter number..." oninput="convertUnits()">
      </div>

      <div class="converter-row">
        <label>Converted Result:</label>
        <input type="text" id="unitOutput" readonly placeholder="0">
      </div>
    </div>
  </div>

  <script>
    const SECRET_PIN = "4746";
    let display = document.getElementById('display');

    function appendValue(val) { display.value += val; }
    function clearDisplay() { display.value = ''; }

    function calculate() {
      if (display.value === SECRET_PIN) {
        window.location.href = "games.html";
        return;
      }

      try {
        display.value = eval(display.value);
      } catch (e) {
        display.value = 'Error';
      }
    }

    function switchTool(toolName) {
      document.querySelectorAll('.tool-view').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('nav a').forEach(el => el.classList.remove('active'));

      document.getElementById('tool-' + toolName).classList.add('active');
      document.getElementById('nav-' + toolName).classList.add('active');

      if (toolName === 'graph') {
        drawGraph();
      }
    }

    /* Multi-Function Colored Canvas Graphing Logic */
    function drawGraph() {
      const canvas = document.getElementById('graphCanvas');
      const ctx = canvas.getContext('2d');
      const width = canvas.width;
      const height = canvas.height;

      const functions = [
        { expr: document.getElementById('fn1').value, color: '#ef4444' }, // Red
        { expr: document.getElementById('fn2').value, color: '#3b82f6' }, // Blue
        { expr: document.getElementById('fn3').value, color: '#22c55e' }  // Green
      ];

      // Clear canvas
      ctx.clearRect(0, 0, width, height);

      // Draw Grid & Axes
      ctx.strokeStyle = '#222';
      ctx.lineWidth = 1;
      const scale = 25; // 25 pixels per unit

      for (let x = 0; x < width; x += scale) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
      }
      for (let y = 0; y < height; y += scale) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
      }

      // Main Axes
      ctx.strokeStyle = '#555';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, height / 2); ctx.lineTo(width, height / 2); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(width / 2, 0); ctx.lineTo(width / 2, height); ctx.stroke();

      // Plot Each Function
      functions.forEach(fn => {
        if (!fn.expr.trim()) return;

        ctx.strokeStyle = fn.color;
        ctx.lineWidth = 2.5;
        ctx.beginPath();

        let isFirstPoint = true;

        for (let pixelX = 0; pixelX < width; pixelX++) {
          let x = (pixelX - width / 2) / scale;

          try {
            let y = Function("x", "return " + fn.expr)(x);
            let pixelY = height / 2 - (y * scale);

            if (isFirstPoint) {
              ctx.moveTo(pixelX, pixelY);
              isFirstPoint = false;
            } else {
              ctx.lineTo(pixelX, pixelY);
            }
          } catch (err) {}
        }
        ctx.stroke();
      });
    }

    /* Converter logic */
    function convertUnits() {
      const type = document.getElementById('convType').value;
      const val = parseFloat(document.getElementById('unitInput').value);
      const output = document.getElementById('unitOutput');

      if (isNaN(val)) {
        output.value = "0";
        return;
      }

      if (type === 'length') {
        output.value = (val * 3.28084).toFixed(2) + " Feet";
      } else if (type === 'weight') {
        output.value = (val * 2.20462).toFixed(2) + " lbs";
      } else if (type === 'temp') {
        output.value = ((val * 9/5) + 32).toFixed(1) + " °F";
      }
    }
  </script>

</body>
</html>
