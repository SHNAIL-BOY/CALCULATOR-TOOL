<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learn Math</title>
  <style>
    body {
      background-color: #3b82f6; /* Bright blue background */
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
    }

    /* Grid container that adjusts column count automatically */
    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 16px;
      max-width: 1100px;
      width: 100%;
    }

    /* Individual game card container */
    .game-card {
      background-color: rgba(255, 255, 255, 0.2); /* Semi-transparent border frame */
      border-radius: 16px;
      padding: 6px;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .game-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.25);
    }

    /* Thumbnail image styling */
    .game-card img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 12px;
    }

    /* Game title label below image */
    .game-title {
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      margin-top: 8px;
      margin-bottom: 4px;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="game-grid">
    
    <a href="#" class="game-card">
      <img src="https://hextris.github.io/hextris/" alt="Hextris">
      <span class="game-title">Hextris</span>
    </a>

        <a href="#" class="game-card">
      <img src="https://shnail-platformer.com/" alt="SHNAIL-PLATFORMER">
      <span class="game-title">SHNAIL-PLATFORMER</span>
    </a>

    </div>

</body>
</html>
