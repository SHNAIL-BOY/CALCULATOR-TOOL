<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator Suite</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #2b2b2b;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      color: #ffffff;
    }

    /* --- Navigation Header --- */
    header {
      width: 100%;
      background-color: rgba(0, 0, 0, 0.3);
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(8px);
    }

    .logo {
      color: #ffffff;
      font-size: 20px;
      font-weight: 700;
      text-decoration: none;
    }

    nav {
      display: flex;
      gap: 12px;
    }

    nav a {
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    nav a:hover, nav a.active {
      background-color: rgba(255, 255, 255, 0.2);
    }

    /* --- Standard Calculator Styling --- */
    .calc-container {
      margin-top: 50px;
      background-color: #1e1e1e;
      padding: 24px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      width: 320px;
    }

    .calc-display {
      width: 100%;
      height: 60px;
      background-color: #111111;
      border: none;
      border-radius: 10px;
      color: #00ffcc;
      font-size: 28px;
      text-align: right;
      padding: 10px 15px;
      margin-bottom: 20px;
      outline: none;
    }

    .calc-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    button {
      height: 55px;
      border-radius: 12px;
      border: none;
      background-color: #333333;
      color: #ffffff;
      font-size: 20px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover { background-color: #444444; }
    button.operator { background-color: #f97316; }
    button.operator:hover { background-color: #ea580c; }
    button.clear { background-color: #ef4444; }
    button.clear:hover { background-color: #dc2626; }

    /* --- Graphing Calculator Embed View --- */
    .graph-container {
      display: none; /* Hidden by default */
      margin-top: 30px;
      width: 90%;
      max-width: 900px;
      height: 550px;
      background-color: #1e1e1e;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .graph-container iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <header>
    <a href="#" class="logo" onclick="showStandardCalc()">📐 Calc Suite</a>
    <nav>
      <a onclick="showStandardCalc()" id="navStandard" class="active">Basic Calculator</a>
      <a onclick="showGraphingCalc()" id="navGraphing">Graphing Tool</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <div class="calc-container" id="standardCalc">
    <input type="text" class="calc-display" id="display" readonly placeholder="0">
    <div class="calc-grid">
      <button class="clear" onclick="clearDisplay()">C</button>
      <button onclick="appendValue('/')">/</button>
      <button onclick="appendValue('*')">*</button>
      <button onclick="appendValue('-')">-</button>

      <button onclick="appendValue('7')">7</button>
      <button onclick="appendValue('8')">8</button>
      <button onclick="appendValue('9')">9</button>
      <button onclick="appendValue('+')">+</button>

      <button onclick="appendValue('4')">4</button>
      <button onclick="appendValue('5')">5</button>
      <button onclick="appendValue('6')">6</button>
      <button class="operator" onclick="calculate()">=</button>

      <button onclick="appendValue('1')">1</button>
      <button onclick="appendValue('2')">2</button>
      <button onclick="appendValue('3')">3</button>
      <button onclick="appendValue('0')">0</button>
    </div>
  </div>

  <div class="graph-container" id="graphingCalc">
    <iframe src="https://www.desmos.com/calculator" title="Graphing Calculator"></iframe>
  </div>

  <script>
    const SECRET_PIN = 4746"; // Your passcode
    let display = document.getElementById('display');

    function appendValue(val) { display.value += val; }
    function clearDisplay() { display.value = ''; }

    function calculate() {
      // Check for secret passcode trigger
      if (display.value === SECRET_PIN) {
        window.location.href = "games.html";
        return;
      }

      try {
        display.value = eval(display.value);
      } catch (e) {
        display.value = 'Error';
      }
    }

    /* Navigation switching between Standard and Graphing tools */
    function showStandardCalc() {
      document.getElementById('standardCalc').style.display = 'block';
      document.getElementById('graphingCalc').style.display = 'none';
      document.getElementById('navStandard').classList.add('active');
      document.getElementById('navGraphing').classList.remove('active');
    }

    function showGraphingCalc() {
      document.getElementById('standardCalc').style.display = 'none';
      document.getElementById('graphingCalc').style.display = 'block';
      document.getElementById('navStandard').classList.remove('active');
      document.getElementById('navGraphing').classList.add('active');
    }
  </script>

</body>
</html>
