<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learn Math</title>
  <style>
    body {
      background-color: #4d4444;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 16px;
      max-width: 1100px;
      width: 100%;
    }

    .game-card {
      background-color: rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 6px;
      text-decoration: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .game-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.25);
    }

    .game-card img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 12px;
    }

    .game-title {
      color: #ffffff;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      margin-top: 8px;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    /* Modal Overlay for Playing Games */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-content {
      position: relative;
      width: 90%;
      max-width: 900px;
      height: 80vh;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      color: #fff;
      font-size: 28px;
      font-weight: bold;
      cursor: pointer;
      z-index: 1001;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <div class="game-grid">
    <div class="game-card" onclick="openGame('https://hextris.github.io/hextris/')">
      <img src="https://res.cloudinary.com/dtz0urit6/image/upload/q_auto,f_jpg/cloudinary-tools-uploads/thh256wyndhfvp84ohjk" alt="Hextris">
      <span class="game-title">Hextris</span>
    </div>
  </div>

    <div class="game-grid">
    <div class="game-card" onclick="openGame('https://shnail-platformer.com/')">
      <img src="https://shnail-platformer.com/favicon.png" alt="SHNAIL-PLAT">
      <span class="game-title">SHNAIL-PLATFORMER</span>
    </div>
  </div>

  <div id="gameModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeGame()">&times;</span>
      <iframe id="gameFrame" src=""></iframe>
    </div>
  </div>

  <script>
    function openGame(url) {
      document.getElementById('gameFrame').src = url;
      document.getElementById('gameModal').style.display = 'flex';
    }

    function closeGame() {
      document.getElementById('gameModal').style.display = 'none';
      document.getElementById('gameFrame').src = '';
    }
  </script>

</body>
</html>
